name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Hygiene, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo hygiene (no secrets, dumps or env files)
        run: npm run check:hygiene

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # `npm run build` also type-checks (tsc -b) before bundling.
      - name: Type-check and build
        run: npm run build
